<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Raghava Capital | Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #ffffff;

            padding: 20px;
        }

        .login-box {
            width: 400px;
            max-width: 100%;

            background: #ffffff;

            padding: 40px;

            border-radius: 20px;

            text-align: center;

            border: 1px solid #e8edf4;

            box-shadow:
                0 12px 40px
                rgba(11, 42, 82, 0.12);
        }

        .logo {
            text-align: center;
            margin-bottom: 15px;
        }

        .logo img {
            width: 280px;
            max-width: 100%;
            height: auto;

            display: block;
            margin: 0 auto;

            object-fit: contain;
        }

        .subtitle {
            color: #6c7a92;

            font-size: 15px;

            margin-bottom: 30px;
        }

        .input-group {
            position: relative;

            margin-bottom: 20px;
        }

        input {
            width: 100%;

            padding: 15px;

            border: 1px solid #d6dce5;

            border-radius: 10px;

            font-size: 15px;

            outline: none;

            color: #172b4d;

            background: #ffffff;

            transition: 0.2s;
        }

        input::placeholder {
            color: #9aa5b5;
        }

        input:focus {
            border-color: #1769d2;

            box-shadow:
                0 0 0 3px
                rgba(23, 105, 210, 0.10);
        }

        /* PASSWORD EYE */

        .show-btn {
            position: absolute;

            right: 8px;

            top: 50%;

            transform: translateY(-50%);

            width: 40px;
            height: 40px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: transparent;

            border: none;

            color: #64748b;

            cursor: pointer;

            border-radius: 8px;

            transition: 0.2s;
        }

        .show-btn:hover {
            background: #f1f5f9;

            color: #1769d2;
        }

        .show-btn svg {
            width: 20px;
            height: 20px;
        }

        /* LOGIN BUTTON */

        .login-button {
            width: 100%;

            padding: 15px;

            background: #1769d2;

            color: white;

            border: none;

            border-radius: 10px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .login-button:hover {
            background: #0f56ad;

            transform: translateY(-1px);

            box-shadow:
                0 5px 15px
                rgba(23, 105, 210, 0.25);
        }

        .error {
            background: #ffe8e8;

            color: #d32f2f;

            padding: 10px;

            border-radius: 8px;

            margin-bottom: 15px;

            font-size: 14px;

            text-align: left;
        }

        .footer {
            margin-top: 25px;

            color: #8a96a8;

            font-size: 12px;

            line-height: 1.6;
        }

        /* MOBILE */

        @media (max-width: 480px) {

            body {
                padding: 15px;
            }

            .login-box {
                width: 100%;

                padding: 30px 22px;

                border-radius: 16px;
            }

            .logo img {
                width: 240px;
            }

            .subtitle {
                font-size: 14px;

                margin-bottom: 25px;
            }

            input {
                padding: 14px;

                font-size: 14px;
            }

            .login-button {
                padding: 14px;

                font-size: 15px;
            }
        }

    </style>

</head>


<body>


    <div class="login-box">


        <!-- LOGO -->

        <div class="logo">

            <img
                src="/static/images/logo.png"
                alt="Raghava Capital Logo"
            >

        </div>


        <!-- SUBTITLE -->

        <p class="subtitle">
            Loan Management System
        </p>


        <!-- LOGIN FORM -->

        <form method="POST">

            {% csrf_token %}


            {% if messages %}

                {% for message in messages %}

                    <div class="error">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}


            <!-- USERNAME -->

            <div class="input-group">

                <input
                    type="text"
                    name="username"
                    placeholder="Username"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="input-group">

                <input
                    type="password"
                    name="password"
                    id="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >


                <button
                    type="button"
                    class="show-btn"
                    onclick="togglePassword()"
                    aria-label="Show password"
                >

                    <svg
                        id="eyeIcon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <path
                            d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"
                        />

                        <circle
                            cx="12"
                            cy="12"
                            r="3"
                        />

                    </svg>

                </button>

            </div>


            <!-- LOGIN -->

            <button
                type="submit"
                class="login-button"
            >
                Login
            </button>

        </form>


        <!-- FOOTER -->

        <div class="footer">

            © 2026 Raghava Capital

            <br>

            Simple Loans. Stronger Futures.

        </div>


    </div>


    <script>

        function togglePassword() {

            const password =
                document.getElementById("password");

            const eye =
                document.getElementById("eyeIcon");

            const button =
                document.querySelector(".show-btn");


            if (password.type === "password") {

                password.type = "text";

                button.setAttribute(
                    "aria-label",
                    "Hide password"
                );

                eye.innerHTML = `
                    <path d="M3 3l18 18"/>

                    <path
                        d="M10.6 10.6a2 2 0 0 0 2.8 2.8"
                    />

                    <path
                        d="M9.9 4.2A10.8 10.8 0 0 1 12 4c7 0 10 8 10 8a17.4 17.4 0 0 1-3.1 4.4"
                    />

                    <path
                        d="M6.6 6.6C3.8 8.4 2 12 2 12s3.5 8 10 8a9.7 9.7 0 0 0 4.1-.9"
                    />
                `;

            }

            else {

                password.type = "password";

                button.setAttribute(
                    "aria-label",
                    "Show password"
                );

                eye.innerHTML = `
                    <path
                        d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"
                    />

                    <circle
                        cx="12"
                        cy="12"
                        r="3"
                    />
                `;

            }

        }

    </script>


</body>

</html>
